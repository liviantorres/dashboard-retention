repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        files: ^backend/
        args:
          [
            "-rn",
            "-sn",
            "--rcfile=backend/.pylintrc",
            "--load-plugins=pylint.extensions.docparams",
          ]
  
  - repo: local
    hooks:
      - id: requirements
        name: requirements
        entry: bash -c 'venv/bin/pip3 freeze > requirements.txt; git add requirements.txt'
        language: system
        pass_filenames: false
        stages: [commit]